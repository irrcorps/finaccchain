name: PHP Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: php -l (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.2']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Lint all PHP files
        run: |
          set -e
          status=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /tmp/lint_output 2>&1; then
              echo "::error file=$file::$(tail -n 1 /tmp/lint_output)"
              cat /tmp/lint_output
              status=1
            fi
          done < <(find . -path ./vendor -prune -o -name '*.php' -print0)
          exit $status
